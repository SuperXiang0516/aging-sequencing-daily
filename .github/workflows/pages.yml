name: 发布 GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: 发布网站
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v7
        with:
          # 任务可能因共享 Pages 并发锁排队；启动时始终发布最新 main，
          # 避免较早的 push 事件在每日任务之后回滚已发布网站。
          ref: main

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传网页产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
          include-hidden-files: true

      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

name: 每日更新与部署

on:
  schedule:
    # 中国大陆全年使用 UTC+8；UTC 00:17 = 北京时间 08:17。
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    name: 抓取、摘要与构建
    runs-on: ubuntu-latest
    env:
      LLM_API_URL: ${{ secrets.LLM_API_URL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
      NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
      # 可选。仅在 Runner 后端查询期刊指标，绝不会传给网页。
      EASYSCHOLAR_SECRET_KEY: ${{ secrets.EASYSCHOLAR_SECRET_KEY }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: 检出 main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: 检查必需的 Secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in LLM_API_URL LLM_API_KEY LLM_MODEL NCBI_EMAIL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::缺少 GitHub Actions Secret：${name}"
              missing=1
            fi
          done
          if [[ "${missing}" -ne 0 ]]; then
            exit 1
          fi

      - name: 运行每日更新
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/aging_daily
          python metaweb.py daily 2>&1 | tee "${RUNNER_TEMP}/daily.log"

      - name: 提交生成的数据
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          generated_paths=(
            data/journal_metrics_cache.json
            web/data.json
            web/data
            web/stats.json
          )
          for path in "${generated_paths[@]}"; do
            if [[ -e "${path}" ]]; then
              git add --force -- "${path}"
            fi
          done

          if git diff --cached --quiet; then
            echo "没有新的文献数据需要提交。"
          else
            git commit -m "chore: 每日更新 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传网页产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: web
          include-hidden-files: true

  deploy:
    name: 发布网站
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
